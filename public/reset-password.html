<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#103f36">
  <title>Reset Leader Password | Awana Clubs Ghana</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f5f7f5;color:#1b302c;font:14px "DM Sans",Arial,sans-serif}.card{width:min(460px,100%);padding:30px;background:white;border:1px solid #e8eeeb;border-radius:10px;box-shadow:0 12px 40px #16392f0b}.card img{width:160px;margin-bottom:25px}.card h1{font:800 26px Manrope,Arial,sans-serif;margin:0 0 8px}.card p{color:#788984;line-height:1.6}.card label{display:block;margin:16px 0;color:#42564e;font-size:12px;font-weight:700}.card input{display:block;width:100%;height:44px;margin-top:7px;padding:10px;border:1px solid #dce5e0;border-radius:5px;font:inherit}.card button{width:100%;height:45px;margin-top:8px;border:0;border-radius:5px;background:#103f36;color:white;font-weight:800;cursor:pointer}.message{min-height:20px;color:#a63e2e;font-size:12px}a{color:#1b6858}
  </style>
</head>
<body>
  <main class="card">
    <a href="/"><img src="/logo.png" alt="Awana Clubs Ghana"></a>
    <h1>Choose a new password</h1>
    <p id="resetSummary">Checking your secure reset link…</p>
    <form id="resetForm" hidden>
      <label>New password<input name="password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></label>
      <label>Confirm password<input name="confirmPassword" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></label>
      <p>Use at least 12 characters. The link can only be used once.</p>
      <button type="submit">Update password</button>
    </form>
    <p class="message" id="message" role="alert"></p>
    <p><a href="/login">Return to leader sign in</a></p>
  </main>
  <script>
    const token = new URLSearchParams(location.search).get("token") || "";
    const form = document.querySelector("#resetForm");
    async function init() {
      try {
        const response = await fetch(`/api/password-resets/${encodeURIComponent(token)}`);
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Reset link unavailable.");
        document.querySelector("#resetSummary").textContent = `Set a new password for ${result.email}.`;
        form.hidden = false;
      } catch (error) {
        document.querySelector("#resetSummary").textContent = error.message;
      }
    }
    form.addEventListener("submit", async event => {
      event.preventDefault();
      const password = form.elements.password.value;
      if (password !== form.elements.confirmPassword.value) {
        document.querySelector("#message").textContent = "Passwords do not match.";
        return;
      }
      const button = form.querySelector("button");
      button.disabled = true;
      try {
        const response = await fetch("/api/password-resets/complete", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body:JSON.stringify({token,password})
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Could not reset password.");
        location.replace("/login?reset=1");
      } catch (error) {
        document.querySelector("#message").textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
    init();
  </script>
</body>
</html>
